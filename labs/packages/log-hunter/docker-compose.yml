services:
  target:
    image: python:3.11-alpine
    container_name: suraksha-log-hunter
    working_dir: /app
    command: sh -c "python3 /setup/generate_logs.py && exec python3 server.py"
    volumes:
      - ./app:/app:ro
      - ./setup:/setup:ro
    ports:
      - "127.0.0.1:8084:8080"
    restart: unless-stopped
