<rect x="560" y="145" width="290" height="66" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="705" y="175" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Normal website</text><text x="705" y="192" text-anchor="middle" font-size="11.5" fill="#a8a49c">what the feature was for</text>
