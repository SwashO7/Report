<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#43bd97"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e56767"/></marker>
<marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dbaa3c"/></marker>
</defs>
<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">The folders that actually matter to you</text>
<rect x="360" y="45" width="160" height="40" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="440" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">/</text><text x="440" y="79" text-anchor="middle" font-size="11.5" fill="#a8a49c">the root of everything</text>
<rect x="30" y="120" width="150" height="52" rx="8" fill="#22261f" stroke="#dbaa3c" stroke-width="1.5"/><text x="105" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">/etc</text><text x="105" y="160" text-anchor="middle" font-size="11.5" fill="#a8a49c">config + passwd</text>
<rect x="200" y="120" width="150" height="52" rx="8" fill="#22261f" stroke="#dbaa3c" stroke-width="1.5"/><text x="275" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">/home</text><text x="275" y="160" text-anchor="middle" font-size="11.5" fill="#a8a49c">user files, keys</text>
<rect x="370" y="120" width="150" height="52" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="445" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">/var</text><text x="445" y="160" text-anchor="middle" font-size="11.5" fill="#a8a49c">logs live here</text>
<rect x="540" y="120" width="150" height="52" rx="8" fill="#22261f" stroke="#e56767" stroke-width="1.5"/><text x="615" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">/tmp</text><text x="615" y="160" text-anchor="middle" font-size="11.5" fill="#a8a49c">world-writable</text>
<rect x="710" y="120" width="140" height="52" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="780" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">/usr/bin</text><text x="780" y="160" text-anchor="middle" font-size="11.5" fill="#a8a49c">programs</text>
<line x1="400" y1="85" x2="120" y2="118" stroke="#3d443a" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="420" y1="85" x2="270" y2="118" stroke="#3d443a" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="440" y1="85" x2="445" y2="118" stroke="#3d443a" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="460" y1="85" x2="600" y2="118" stroke="#3d443a" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="480" y1="85" x2="770" y2="118" stroke="#3d443a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="210" width="400" height="60" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="230" y="237" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6">First places to look on a new box</text><text x="230" y="254" text-anchor="middle" font-size="11.5" fill="#a8a49c">/etc/passwd  /home/*/.ssh  /var/log/auth.log</text>
<rect x="460" y="210" width="390" height="60" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="655" y="237" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6">No drive letters</text><text x="655" y="254" text-anchor="middle" font-size="11.5" fill="#a8a49c">everything hangs off one tree, including USB sticks</text>
</svg>