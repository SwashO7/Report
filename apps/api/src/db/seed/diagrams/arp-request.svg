<rect x="360" y="60" width="170" height="44" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="445" y="79" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Laptop B</text><text x="445" y="96" text-anchor="middle" font-size="11.5" fill="#a8a49c">192.168.1.11</text>
<rect x="360" y="118" width="170" height="44" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="445" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Printer</text><text x="445" y="154" text-anchor="middle" font-size="11.5" fill="#a8a49c">192.168.1.12</text>
<rect x="360" y="176" width="170" height="44" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="445" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Router</text><text x="445" y="212" text-anchor="middle" font-size="11.5" fill="#a8a49c">192.168.1.1</text>
