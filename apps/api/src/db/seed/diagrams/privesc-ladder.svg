<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#43bd97"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e56767"/></marker>
<marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dbaa3c"/></marker>
</defs>
<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">Privilege escalation is a ladder of small misconfigurations</text>
<rect x="30" y="195" width="200" height="56" rx="8" fill="#22261f" stroke="#a8a49c" stroke-width="1.5"/><text x="130" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">You: low-priv shell</text><text x="130" y="237" text-anchor="middle" font-size="11.5" fill="#a8a49c">www-data</text>
<rect x="255" y="145" width="200" height="56" rx="8" fill="#22261f" stroke="#dbaa3c" stroke-width="1.5"/><text x="355" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Readable secret</text><text x="355" y="187" text-anchor="middle" font-size="11.5" fill="#a8a49c">config file, .env, history</text>
<rect x="480" y="95" width="200" height="56" rx="8" fill="#22261f" stroke="#dbaa3c" stroke-width="1.5"/><text x="580" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Reusable credential</text><text x="580" y="137" text-anchor="middle" font-size="11.5" fill="#a8a49c">password reused for a user</text>
<rect x="660" y="40" width="190" height="56" rx="8" fill="#301718" stroke="#e56767" stroke-width="1.5"/><text x="755" y="65" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">root</text><text x="755" y="82" text-anchor="middle" font-size="11.5" fill="#a8a49c">game over</text>
<line x1="230" y1="205" x2="255" y2="180" stroke="#dbaa3c" stroke-width="1.5" marker-end="url(#aW)"/>
<line x1="455" y1="155" x2="480" y2="130" stroke="#dbaa3c" stroke-width="1.5" marker-end="url(#aW)"/>
<line x1="680" y1="105" x2="720" y2="90" stroke="#e56767" stroke-width="1.5" marker-end="url(#aD)"/>
<rect x="30" y="60" width="200" height="56" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="130" y="85" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">Usual first checks</text><text x="130" y="102" text-anchor="middle" font-size="11.5" fill="#a8a49c">sudo -l, SUID, cron, caps</text>
<text x="440" y="268" text-anchor="middle" font-size="12" font-weight="400" fill="#43bd97">No single step is dramatic. The chain is the finding - report it as one.</text>
</svg>