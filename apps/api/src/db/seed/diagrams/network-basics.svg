<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#43bd97"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e56767"/></marker>
<marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dbaa3c"/></marker>
</defs>
<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">Your data crosses four hops to reach a server</text>
<rect x="20" y="60" width="150" height="80" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="95" y="97" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Your laptop</text><text x="95" y="114" text-anchor="middle" font-size="11.5" fill="#a8a49c">192.168.1.10</text>
<rect x="240" y="60" width="150" height="80" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="315" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Home router</text><text x="315" y="107" text-anchor="middle" font-size="11.5" fill="#a8a49c">gives out local IPs</text><text x="315" y="122" text-anchor="middle" font-size="11.5" fill="#a8a49c">one public IP</text>
<rect x="460" y="60" width="150" height="80" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="535" y="97" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Your ISP</text><text x="535" y="114" text-anchor="middle" font-size="11.5" fill="#a8a49c">routes toward the target</text>
<rect x="680" y="60" width="180" height="80" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="770" y="97" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Web server</text><text x="770" y="114" text-anchor="middle" font-size="11.5" fill="#a8a49c">142.250.72.14</text>
<line x1="170" y1="100" x2="240" y2="100" stroke="#a8a49c" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="390" y1="100" x2="460" y2="100" stroke="#a8a49c" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="610" y1="100" x2="680" y2="100" stroke="#a8a49c" stroke-width="1.5" marker-end="url(#a)"/>
<text x="440" y="180" text-anchor="middle" font-size="12" font-weight="400" fill="#77746c">Every attack in history travelled a path like this one.</text>
</svg>