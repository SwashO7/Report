<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#43bd97"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e56767"/></marker>
<marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dbaa3c"/></marker>
</defs>
<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">One over-permissive role is the whole account</text>
<rect x="20" y="80" width="150" height="60" rx="8" fill="#22261f" stroke="#dbaa3c" stroke-width="1.5"/><text x="95" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Leaked key</text><text x="95" y="124" text-anchor="middle" font-size="11.5" fill="#a8a49c">read-only, "harmless"</text>
<rect x="220" y="80" width="170" height="60" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="305" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Can list roles</text><text x="305" y="124" text-anchor="middle" font-size="11.5" fill="#a8a49c">iam:ListRoles</text>
<rect x="440" y="80" width="180" height="60" rx="8" fill="#22261f" stroke="#dbaa3c" stroke-width="1.5"/><text x="530" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Can assume a role</text><text x="530" y="124" text-anchor="middle" font-size="11.5" fill="#a8a49c">sts:AssumeRole</text>
<rect x="670" y="80" width="180" height="60" rx="8" fill="#301718" stroke="#e56767" stroke-width="1.5"/><text x="760" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Admin</text><text x="760" y="124" text-anchor="middle" font-size="11.5" fill="#a8a49c">full account</text>
<line x1="170" y1="110" x2="220" y2="110" stroke="#dbaa3c" stroke-width="1.5" marker-end="url(#aW)"/>
<line x1="390" y1="110" x2="440" y2="110" stroke="#dbaa3c" stroke-width="1.5" marker-end="url(#aW)"/>
<line x1="620" y1="110" x2="670" y2="110" stroke="#e56767" stroke-width="1.5" marker-end="url(#aD)"/>
<text x="440" y="180" text-anchor="middle" font-size="12.5" font-weight="400" fill="#eceae6">Each step alone looks low severity. The chain is critical.</text>
<text x="440" y="208" text-anchor="middle" font-size="12" font-weight="400" fill="#43bd97">This is why you always report the chain, not the first link.</text>
</svg>