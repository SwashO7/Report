<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">A JWT is not encrypted. Anyone can read it.</text>
<rect x="30" y="60" width="250" height="50" rx="8" fill="#301718" stroke="#e56767" stroke-width="1.5"/><text x="155" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">eyJhbGciOiJIUzI1NiJ9</text>
<rect x="300" y="60" width="280" height="50" rx="8" fill="#2d2413" stroke="#dbaa3c" stroke-width="1.5"/><text x="440" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">eyJzdWIiOiI0MiIsInJvbGUi...</text>
<rect x="600" y="60" width="250" height="50" rx="8" fill="#1d2f28" stroke="#43bd97" stroke-width="1.5"/><text x="725" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">SflKxwRJSMeKKF2QT4f...</text>
<text x="155" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#e56767">HEADER</text>
<text x="440" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#dbaa3c">PAYLOAD</text>
<text x="725" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#43bd97">SIGNATURE</text>
<rect x="30" y="145" width="250" height="76" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="155" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">{ "alg": "HS256" }</text><text x="155" y="190" text-anchor="middle" font-size="11.5" fill="#a8a49c">change alg to none?</text><text x="155" y="205" text-anchor="middle" font-size="11.5" fill="#a8a49c">that is attack #1</text>
<rect x="300" y="145" width="280" height="76" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="440" y="173" text-anchor="middle" font-size="11.5" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">{ "sub": "42", "role": "user" }</text><text x="440" y="190" text-anchor="middle" font-size="11.5" fill="#a8a49c">base64, not secret</text><text x="440" y="205" text-anchor="middle" font-size="11.5" fill="#a8a49c">change role to admin?</text>
<rect x="600" y="145" width="250" height="76" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="725" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#eceae6">Keyed hash</text><text x="725" y="190" text-anchor="middle" font-size="11.5" fill="#a8a49c">the only thing</text><text x="725" y="205" text-anchor="middle" font-size="11.5" fill="#a8a49c">stopping you</text>
<text x="440" y="252" text-anchor="middle" font-size="12" font-weight="400" fill="#eceae6">Never put secrets in the payload. Always verify the signature server-side.</text>
