<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#43bd97"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e56767"/></marker>
<marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dbaa3c"/></marker>
</defs>
<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">Read -rwxr-xr-- once and you can read them all</text>
<text x="120" y="78" text-anchor="middle" font-size="30" font-weight="400" fill="#77746c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">-</text>
<text x="240" y="78" text-anchor="middle" font-size="30" font-weight="400" fill="#43bd97" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">rwx</text>
<text x="420" y="78" text-anchor="middle" font-size="30" font-weight="400" fill="#dbaa3c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">r-x</text>
<text x="600" y="78" text-anchor="middle" font-size="30" font-weight="400" fill="#a8a49c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">r--</text>
<rect x="70" y="100" width="100" height="62" rx="8" fill="#22261f" stroke="#77746c" stroke-width="1.5"/><text x="120" y="121" text-anchor="middle" font-size="12" font-weight="600" fill="#eceae6">type</text><text x="120" y="138" text-anchor="middle" font-size="11.5" fill="#a8a49c">- file</text><text x="120" y="153" text-anchor="middle" font-size="11.5" fill="#a8a49c">d directory</text>
<rect x="190" y="100" width="100" height="62" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="240" y="121" text-anchor="middle" font-size="12" font-weight="600" fill="#eceae6">owner</text><text x="240" y="138" text-anchor="middle" font-size="11.5" fill="#a8a49c">read write</text><text x="240" y="153" text-anchor="middle" font-size="11.5" fill="#a8a49c">execute</text>
<rect x="370" y="100" width="100" height="62" rx="8" fill="#22261f" stroke="#dbaa3c" stroke-width="1.5"/><text x="420" y="121" text-anchor="middle" font-size="12" font-weight="600" fill="#eceae6">group</text><text x="420" y="138" text-anchor="middle" font-size="11.5" fill="#a8a49c">read</text><text x="420" y="153" text-anchor="middle" font-size="11.5" fill="#a8a49c">execute</text>
<rect x="550" y="100" width="100" height="62" rx="8" fill="#22261f" stroke="#a8a49c" stroke-width="1.5"/><text x="600" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#eceae6">everyone</text><text x="600" y="145" text-anchor="middle" font-size="11.5" fill="#a8a49c">read only</text>
<rect x="700" y="100" width="150" height="62" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="775" y="121" text-anchor="middle" font-size="12" font-weight="600" fill="#eceae6">Numeric</text><text x="775" y="138" text-anchor="middle" font-size="11.5" fill="#a8a49c">r=4 w=2 x=1</text><text x="775" y="153" text-anchor="middle" font-size="11.5" fill="#a8a49c">rwxr-xr-- = 754</text>
<text x="440" y="205" text-anchor="middle" font-size="12.5" font-weight="400" fill="#eceae6">On a directory, x means "may enter", not "may run".</text>
<text x="440" y="232" text-anchor="middle" font-size="12" font-weight="400" fill="#dbaa3c">World-writable files and stray SUID bits are how a low user becomes root.</text>
<text x="440" y="262" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a8a49c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">chmod 640 secrets.txt   -&gt;   owner reads and writes, group reads, others nothing</text>
</svg>