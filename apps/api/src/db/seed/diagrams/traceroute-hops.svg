<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#43bd97"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e56767"/></marker>
<marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dbaa3c"/></marker>
</defs>
<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">Traceroute: each hop reports itself by expiring on purpose</text>
<rect x="20" y="70" width="130" height="60" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="85" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">You</text>
<rect x="190" y="70" width="130" height="60" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="255" y="97" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Hop 1</text><text x="255" y="114" text-anchor="middle" font-size="11.5" fill="#a8a49c">home router</text>
<rect x="360" y="70" width="130" height="60" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="425" y="97" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Hop 2</text><text x="425" y="114" text-anchor="middle" font-size="11.5" fill="#a8a49c">ISP edge</text>
<rect x="530" y="70" width="130" height="60" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="595" y="97" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Hop 3</text><text x="595" y="114" text-anchor="middle" font-size="11.5" fill="#a8a49c">backbone</text>
<rect x="700" y="70" width="160" height="60" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="780" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Target</text>
<line x1="150" y1="100" x2="190" y2="100" stroke="#a8a49c" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="320" y1="100" x2="360" y2="100" stroke="#a8a49c" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="490" y1="100" x2="530" y2="100" stroke="#a8a49c" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="660" y1="100" x2="700" y2="100" stroke="#a8a49c" stroke-width="1.5" marker-end="url(#a)"/>
<text x="255" y="155" text-anchor="middle" font-size="11" font-weight="400" fill="#dbaa3c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">TTL=1</text>
<text x="425" y="155" text-anchor="middle" font-size="11" font-weight="400" fill="#dbaa3c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">TTL=2</text>
<text x="595" y="155" text-anchor="middle" font-size="11" font-weight="400" fill="#dbaa3c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">TTL=3</text>
<text x="440" y="185" text-anchor="middle" font-size="12" font-weight="400" fill="#77746c">A hop that times out is usually a firewall, not a broken network.</text>
</svg>