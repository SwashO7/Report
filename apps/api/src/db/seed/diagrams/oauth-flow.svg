<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#43bd97"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e56767"/></marker>
<marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dbaa3c"/></marker>
</defs>
<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">"Login with Google" - nobody hands over a password</text>
<rect x="20" y="80" width="150" height="60" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="95" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">You</text>
<rect x="250" y="80" width="180" height="60" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="340" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">The app</text><text x="340" y="124" text-anchor="middle" font-size="11.5" fill="#a8a49c">wants your identity</text>
<rect x="520" y="80" width="180" height="60" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="610" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Google</text><text x="610" y="124" text-anchor="middle" font-size="11.5" fill="#a8a49c">already knows you</text>
<rect x="760" y="80" width="100" height="60" rx="8" fill="#17281f" stroke="#52b788" stroke-width="1.5"/><text x="810" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#eceae6">Logged in</text>
<line x1="170" y1="100" x2="250" y2="100" stroke="#a8a49c" stroke-width="1.5" marker-end="url(#a)"/><text x="210" y="92" text-anchor="middle" font-size="11.5" fill="#a8a49c">1. sign in</text>
<line x1="430" y1="95" x2="520" y2="95" stroke="#a8a49c" stroke-width="1.5" marker-end="url(#a)"/><text x="475" y="87" text-anchor="middle" font-size="11.5" fill="#a8a49c">2. redirect</text>
<line x1="520" y1="128" x2="430" y2="128" stroke="#43bd97" stroke-width="1.5" marker-end="url(#aA)"/><text x="475" y="144" text-anchor="middle" font-size="11.5" fill="#43bd97">3. code</text>
<line x1="700" y1="100" x2="760" y2="100" stroke="#52b788" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="250" y="185" width="450" height="50" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="475" y="215" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">4. app swaps the code for a token, server to server</text>
<line x1="340" y1="140" x2="340" y2="183" stroke="#43bd97" stroke-width="1.5" marker-end="url(#aA)"/>
<text x="440" y="268" text-anchor="middle" font-size="12" font-weight="400" fill="#dbaa3c">Bugs live in the redirect: a sloppy redirect_uri check hands your code to an attacker.</text>
</svg>