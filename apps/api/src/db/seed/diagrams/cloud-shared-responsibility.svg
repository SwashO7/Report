<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#43bd97"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e56767"/></marker>
<marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dbaa3c"/></marker>
</defs>
<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">The cloud secures itself. Your side is still yours.</text>
<rect x="30" y="50" width="400" height="190" rx="8" fill="none" stroke="#43bd97" stroke-width="1.5"/><text x="230" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6"></text>
<text x="230" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#43bd97">YOUR responsibility</text>
<rect x="55" y="90" width="350" height="34" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="230" y="112" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">Who can access what (IAM)</text>
<rect x="55" y="132" width="350" height="34" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="230" y="154" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">Bucket and database permissions</text>
<rect x="55" y="174" width="350" height="34" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="230" y="196" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">Your application code and secrets</text>
<rect x="450" y="50" width="400" height="190" rx="8" fill="none" stroke="#77746c" stroke-width="1.5"/><text x="650" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6"></text>
<text x="650" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">THE PROVIDER’S responsibility</text>
<rect x="475" y="90" width="350" height="34" rx="8" fill="#22261f" stroke="#77746c" stroke-width="1.5"/><text x="650" y="112" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">Physical data centres</text>
<rect x="475" y="132" width="350" height="34" rx="8" fill="#22261f" stroke="#77746c" stroke-width="1.5"/><text x="650" y="154" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">Hypervisor and host patching</text>
<rect x="475" y="174" width="350" height="34" rx="8" fill="#22261f" stroke="#77746c" stroke-width="1.5"/><text x="650" y="196" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">Network hardware</text>
<text x="230" y="228" text-anchor="middle" font-size="11.5" font-weight="400" fill="#dbaa3c">Nearly every cloud breach happens here</text>
</svg>