<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#43bd97"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e56767"/></marker>
<marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dbaa3c"/></marker>
</defs>
<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">NAT: many private devices, one public address</text>
<rect x="20" y="45" width="360" height="210" rx="10" fill="none" stroke="#43bd97" stroke-width="1.2" stroke-dasharray="6 5"/><text x="30" y="63" text-anchor="start" font-size="11.5" font-weight="600" fill="#43bd97">Your home network - private, not routable</text>
<rect x="50" y="80" width="150" height="40" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="125" y="97" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Laptop</text><text x="125" y="114" text-anchor="middle" font-size="11.5" fill="#a8a49c">192.168.1.10</text>
<rect x="50" y="135" width="150" height="40" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="125" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Phone</text><text x="125" y="169" text-anchor="middle" font-size="11.5" fill="#a8a49c">192.168.1.11</text>
<rect x="50" y="190" width="150" height="40" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="125" y="207" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Smart TV</text><text x="125" y="224" text-anchor="middle" font-size="11.5" fill="#a8a49c">192.168.1.12</text>
<rect x="240" y="120" width="120" height="70" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="300" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Router</text><text x="300" y="162" text-anchor="middle" font-size="11.5" fill="#a8a49c">rewrites</text><text x="300" y="177" text-anchor="middle" font-size="11.5" fill="#a8a49c">addresses</text>
<line x1="200" y1="100" x2="240" y2="140" stroke="#a8a49c" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="200" y1="155" x2="240" y2="155" stroke="#a8a49c" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="200" y1="210" x2="240" y2="172" stroke="#a8a49c" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="390" y1="155" x2="470" y2="155" stroke="#43bd97" stroke-width="1.5" marker-end="url(#aA)"/><text x="430" y="143" text-anchor="middle" font-size="11.5" fill="#43bd97">all traffic looks like</text>
<rect x="470" y="120" width="190" height="70" rx="8" fill="#1d2f28" stroke="#43bd97" stroke-width="1.5"/><text x="565" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">203.0.113.45</text><text x="565" y="169" text-anchor="middle" font-size="11.5" fill="#a8a49c">one public IP</text>
<line x1="660" y1="155" x2="720" y2="155" stroke="#a8a49c" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="720" y="120" width="140" height="70" rx="8" fill="#22261f" stroke="#77746c" stroke-width="1.5"/><text x="790" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6">Internet</text>
<text x="440" y="288" text-anchor="middle" font-size="12" font-weight="400" fill="#77746c">The whole internet sees one address. The router remembers who asked.</text>
</svg>