<rect x="660" y="55" width="190" height="50" rx="8" fill="#17281f" stroke="#52b788" stroke-width="1.5"/><text x="755" y="77" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">Your invoice</text><text x="755" y="94" text-anchor="middle" font-size="11.5" fill="#a8a49c">correct</text>
