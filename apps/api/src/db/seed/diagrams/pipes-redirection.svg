<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#43bd97"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e56767"/></marker>
<marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dbaa3c"/></marker>
</defs>
<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">A pipe feeds one command’s output into the next one’s input</text>
<rect x="30" y="70" width="170" height="56" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="115" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">cat access.log</text>
<rect x="250" y="70" width="170" height="56" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="335" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">grep 500</text><text x="335" y="112" text-anchor="middle" font-size="11.5" fill="#a8a49c">keep error lines</text>
<rect x="470" y="70" width="170" height="56" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="555" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">wc -l</text><text x="555" y="112" text-anchor="middle" font-size="11.5" fill="#a8a49c">count them</text>
<rect x="690" y="70" width="160" height="56" rx="8" fill="#1d2f28" stroke="#43bd97" stroke-width="1.5"/><text x="770" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6">42</text><text x="770" y="112" text-anchor="middle" font-size="11.5" fill="#a8a49c">your answer</text>
<line x1="200" y1="98" x2="250" y2="98" stroke="#43bd97" stroke-width="1.5" marker-end="url(#aA)"/><text x="225" y="88" text-anchor="middle" font-size="11.5" fill="#43bd97">|</text>
<line x1="420" y1="98" x2="470" y2="98" stroke="#43bd97" stroke-width="1.5" marker-end="url(#aA)"/><text x="445" y="88" text-anchor="middle" font-size="11.5" fill="#43bd97">|</text>
<line x1="640" y1="98" x2="690" y2="98" stroke="#43bd97" stroke-width="1.5" marker-end="url(#aA)"/>
<rect x="30" y="160" width="390" height="60" rx="8" fill="#22261f" stroke="#dbaa3c" stroke-width="1.5"/><text x="225" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6">&gt;  overwrites a file</text><text x="225" y="204" text-anchor="middle" font-size="11.5" fill="#a8a49c">cmd &gt; out.txt   destroys what was there</text>
<rect x="460" y="160" width="390" height="60" rx="8" fill="#22261f" stroke="#52b788" stroke-width="1.5"/><text x="655" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6">&gt;&gt;  appends to a file</text><text x="655" y="204" text-anchor="middle" font-size="11.5" fill="#a8a49c">cmd &gt;&gt; out.txt   adds to the end</text>
</svg>