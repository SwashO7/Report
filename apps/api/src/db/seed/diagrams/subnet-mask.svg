<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#43bd97"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e56767"/></marker>
<marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dbaa3c"/></marker>
</defs>
<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">A mask just says where the network ends and hosts begin</text>
<text x="60" y="70" text-anchor="start" font-size="16" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">192.168.1.10 / 24</text>
<rect x="60" y="95" width="480" height="50" rx="8" fill="#1d2f28" stroke="#43bd97" stroke-width="1.5"/><text x="300" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6"></text>
<text x="300" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#43bd97" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">192.168.1  =  the network</text>
<rect x="560" y="95" width="260" height="50" rx="8" fill="#2d2413" stroke="#dbaa3c" stroke-width="1.5"/><text x="690" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6"></text>
<text x="690" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#dbaa3c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">.10  =  this host</text>
<text x="300" y="170" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a8a49c">24 bits locked</text>
<text x="690" y="170" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a8a49c">8 bits free = 254 usable hosts</text>
<rect x="60" y="195" width="360" height="44" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="240" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">/16  =  65,534 hosts</text><text x="240" y="231" text-anchor="middle" font-size="11.5" fill="#a8a49c">big corporate network</text>
<rect x="460" y="195" width="360" height="44" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="640" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">/32  =  exactly one host</text><text x="640" y="231" text-anchor="middle" font-size="11.5" fill="#a8a49c">a single machine</text>
</svg>