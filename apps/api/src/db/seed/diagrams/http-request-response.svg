<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#43bd97"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e56767"/></marker>
<marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dbaa3c"/></marker>
</defs>
<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">Every web interaction is one request and one response</text>
<rect x="20" y="60" width="400" height="250" rx="8" fill="none" stroke="#43bd97" stroke-width="1.5"/><text x="220" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6"></text>
<text x="220" y="84" text-anchor="middle" font-size="12.5" font-weight="600" fill="#43bd97">REQUEST  (you -&gt; server)</text>
<text x="45" y="112" text-anchor="start" font-size="12.5" font-weight="400" fill="#eceae6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">GET /account?id=7 HTTP/1.1</text>
<text x="45" y="138" text-anchor="start" font-size="12" font-weight="400" fill="#a8a49c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Host: shop.example.com</text>
<text x="45" y="160" text-anchor="start" font-size="12" font-weight="400" fill="#dbaa3c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Cookie: session=abc123</text>
<text x="45" y="182" text-anchor="start" font-size="12" font-weight="400" fill="#a8a49c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">User-Agent: Mozilla/5.0</text>
<rect x="45" y="205" width="350" height="42" rx="8" fill="#22261f" stroke="#dbaa3c" stroke-width="1.5"/><text x="220" y="223" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">method + path + headers</text><text x="220" y="240" text-anchor="middle" font-size="11.5" fill="#a8a49c">anything here is attacker-controlled</text>
<text x="220" y="280" text-anchor="middle" font-size="11.5" font-weight="400" fill="#43bd97">Change ?id=7 to ?id=8 and you have tested an IDOR.</text>
<rect x="460" y="60" width="400" height="250" rx="8" fill="none" stroke="#77746c" stroke-width="1.5"/><text x="660" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#eceae6"></text>
<text x="660" y="84" text-anchor="middle" font-size="12.5" font-weight="600" fill="#77746c">RESPONSE  (server -&gt; you)</text>
<text x="485" y="112" text-anchor="start" font-size="12.5" font-weight="400" fill="#52b788" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">HTTP/1.1 200 OK</text>
<text x="485" y="138" text-anchor="start" font-size="12" font-weight="400" fill="#a8a49c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Content-Type: text/html</text>
<text x="485" y="160" text-anchor="start" font-size="12" font-weight="400" fill="#dbaa3c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Set-Cookie: session=abc123</text>
<text x="485" y="182" text-anchor="start" font-size="12" font-weight="400" fill="#e56767" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Server: nginx/1.24.0</text>
<rect x="485" y="205" width="350" height="42" rx="8" fill="#22261f" stroke="#e56767" stroke-width="1.5"/><text x="660" y="223" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">status + headers + body</text><text x="660" y="240" text-anchor="middle" font-size="11.5" fill="#a8a49c">leaky headers are free findings</text>
<text x="660" y="280" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a8a49c">2xx worked  3xx moved  4xx your fault  5xx their fault</text>
</svg>