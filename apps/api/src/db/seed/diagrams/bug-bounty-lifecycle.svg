<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">What actually happens between finding and getting paid</text>
<rect x="15" y="75" width="120" height="58" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="75" y="101" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">1. Recon</text><text x="75" y="118" text-anchor="middle" font-size="11.5" fill="#a8a49c">map assets</text>
<rect x="155" y="75" width="120" height="58" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="215" y="101" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">2. Test</text><text x="215" y="118" text-anchor="middle" font-size="11.5" fill="#a8a49c">find the bug</text>
<rect x="295" y="75" width="130" height="58" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="360" y="101" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">3. Prove it</text><text x="360" y="118" text-anchor="middle" font-size="11.5" fill="#a8a49c">clean PoC</text>
<rect x="445" y="75" width="130" height="58" rx="8" fill="#22261f" stroke="#43bd97" stroke-width="1.5"/><text x="510" y="101" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">4. Report</text><text x="510" y="118" text-anchor="middle" font-size="11.5" fill="#a8a49c">impact first</text>
<rect x="595" y="75" width="120" height="58" rx="8" fill="#22261f" stroke="#3d443a" stroke-width="1.5"/><text x="655" y="101" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">5. Triage</text><text x="655" y="118" text-anchor="middle" font-size="11.5" fill="#a8a49c">they verify</text>
<rect x="735" y="75" width="130" height="58" rx="8" fill="#22261f" stroke="#52b788" stroke-width="1.5"/><text x="800" y="101" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">6. Bounty</text><text x="800" y="118" text-anchor="middle" font-size="11.5" fill="#a8a49c">or duplicate</text>
