<text x="210" y="168" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a8a49c">Most beginners live here</text>
<text x="510" y="168" text-anchor="middle" font-size="11.5" font-weight="600" fill="#43bd97">Money is actually made here</text>
<text x="440" y="210" text-anchor="middle" font-size="12" font-weight="400" fill="#eceae6">Two hunters find the same bug. The one who explained the impact gets paid more.</text>
