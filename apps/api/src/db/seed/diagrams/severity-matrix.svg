<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#43bd97"/></marker>
<marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e56767"/></marker>
<marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dbaa3c"/></marker>
</defs>
<text x="440" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#77746c">Severity is impact times how easily it can be done</text>
<text x="50" y="60" text-anchor="start" font-size="12" font-weight="600" fill="#77746c">Impact</text>
<text x="440" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="#77746c">How easy to exploit  -&gt;</text>
<rect x="120" y="75" width="220" height="70" rx="8" fill="#2d2413" stroke="#dbaa3c" stroke-width="1.5"/><text x="230" y="107" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6">HIGH</text><text x="230" y="124" text-anchor="middle" font-size="11.5" fill="#a8a49c">needs rare conditions</text>
<rect x="360" y="75" width="220" height="70" rx="8" fill="#301718" stroke="#e56767" stroke-width="1.5"/><text x="470" y="107" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6">CRITICAL</text><text x="470" y="124" text-anchor="middle" font-size="11.5" fill="#a8a49c">anyone, any account</text>
<rect x="120" y="155" width="220" height="70" rx="8" fill="#22261f" stroke="#a8a49c" stroke-width="1.5"/><text x="230" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6">LOW</text><text x="230" y="204" text-anchor="middle" font-size="11.5" fill="#a8a49c">hard and harmless</text>
<rect x="360" y="155" width="220" height="70" rx="8" fill="#22261f" stroke="#dbaa3c" stroke-width="1.5"/><text x="470" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#eceae6">MEDIUM</text><text x="470" y="204" text-anchor="middle" font-size="11.5" fill="#a8a49c">easy but limited</text>
<rect x="620" y="75" width="240" height="70" rx="8" fill="#22261f" stroke="#e56767" stroke-width="1.5"/><text x="740" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">Examples</text><text x="740" y="117" text-anchor="middle" font-size="11.5" fill="#a8a49c">account takeover, RCE,</text><text x="740" y="132" text-anchor="middle" font-size="11.5" fill="#a8a49c">other users’ data</text>
<rect x="620" y="155" width="240" height="70" rx="8" fill="#22261f" stroke="#a8a49c" stroke-width="1.5"/><text x="740" y="180" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">Examples</text><text x="740" y="197" text-anchor="middle" font-size="11.5" fill="#a8a49c">missing header, self-XSS,</text><text x="740" y="212" text-anchor="middle" font-size="11.5" fill="#a8a49c">verbose error page</text>
<text x="440" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eceae6">Ask one question: what can an attacker DO with it, and who to?</text>
<text x="440" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#a8a49c">A bug with no answer to that is a note, not a report.</text>
</svg>