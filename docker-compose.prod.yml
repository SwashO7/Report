# Suraksha Labs — full production stack
# Usage: cp apps/api/.env.example .env  (fill in secrets) && docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suraksha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-suraksha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-suraksha} -d ${POSTGRES_DB:-suraksha}']
      interval: 5s
      timeout: 5s
      retries: 12
    # Not exposed publicly; only reachable on the compose network.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:?set APP_URL in .env}
      API_URL: ${API_URL:?set API_URL in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-suraksha}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-suraksha}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      FLAG_HMAC_SECRET: ${FLAG_HMAC_SECRET:?set FLAG_HMAC_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Suraksha Labs <no-reply@surakshalabs.example>}
      STORAGE_DIR: /app/apps/api/storage
    volumes:
      - labpackages:/app/apps/api/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-80}:80'

volumes:
  pgdata:
  labpackages:
