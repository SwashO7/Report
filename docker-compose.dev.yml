services:
  postgres:
    image: postgres:16-alpine
    container_name: suraksha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: suraksha
      POSTGRES_PASSWORD: suraksha
      POSTGRES_DB: suraksha
    ports:
      - '5433:5432'
    volumes:
      - suraksha_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U suraksha -d suraksha']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  suraksha_pgdata:
